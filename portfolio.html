<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>เกียรติบัตร | Portfolio</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box
}

html{
scroll-behavior:smooth
}

body{
font-family:Arial,"Noto Sans Thai",sans-serif;
background:#f5f5f5;
color:#222
}

nav{
height:75px;
padding:0 7%;
display:flex;
justify-content:space-between;
align-items:center;
background:#fff;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:10
}

.logo{
font-weight:bold;
letter-spacing:3px
}

.links{
display:flex;
gap:30px
}

.links a{
text-decoration:none;
color:#777;
font-size:15px
}

.links a:hover,
.links .selected{
color:#111;
font-weight:bold
}

.content{
max-width:1100px;
margin:auto;
padding:70px 25px
}

.header{
text-align:center;
margin-bottom:55px
}

.header small{
letter-spacing:4px;
color:#888
}

.header h1{
font-size:60px;
margin:10px 0
}

.line{
width:80px;
height:3px;
background:#222;
margin:20px auto
}

.header p{
color:#777
}

.certificates{
display:flex;
flex-direction:column;
gap:45px
}

.certificate{
background:#fff;
border-radius:20px;
overflow:hidden;
border:1px solid #ddd;
box-shadow:0 8px 30px #00000010
}

/* ปรับการจัดวางรูปภาพเกียรติบัตรและรูปภาพเราให้อยู่ข้างกัน */
.cert-images{
display:grid;
grid-template-columns:1fr 1fr;
background:#eee;
border-bottom:1px solid #eee;
gap:2px;
}

.cert-images img{
display:block;
width:100%;
height:350px;
object-fit:cover;
background:#eee
}

.cert-info{
padding:25px 30px
}

.cert-info small{
color:#999;
letter-spacing:3px
}

.cert-info h2{
margin:8px 0 10px;
font-size:23px
}

.back{
text-align:center;
margin-top:55px
}

.btn{
display:inline-flex;
align-items:center;
gap:18px;
padding:15px 28px;
border-radius:50px;
background:#222;
color:#fff;
font-size:16px;
text-decoration:none;
transition:.3s
}

.btn:hover{
background:#555;
transform:translateY(-3px)
}

footer{
text-align:center;
padding:35px;
background:#222;
color:#aaa;
font-size:13px
}

@media(max-width:750px){

nav{
padding:0 15px
}

.logo{
display:none
}

.links{
gap:15px;
width:100%;
justify-content:center
}

.links a{
font-size:12px
}

.header h1{
font-size:42px
}

.cert-images{
grid-template-columns:1fr;
}

.cert-images img{
height:auto;
max-height:400px;
}

}
</style>

</head>

<body>
